name: Build
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          mc_version=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "full=${mc_version}-${mod_version}" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that does not match the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          FULL: ${{ steps.version.outputs.full }}
        run: |
          if [ "$TAG" != "v${FULL}" ]; then
            echo "Tag $TAG does not match version v${FULL}."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Store reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedBackpacks-${{ steps.version.outputs.full }}
          path: build/libs/*.jar

      - name: Attest the mod jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/libs/sophisticatedbackpacks-${{ steps.version.outputs.full }}.jar

      - name: Create the release (draft, then publish)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FULL: ${{ steps.version.outputs.full }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file changelog.md \
            "build/libs/sophisticatedbackpacks-${FULL}.jar" \
            "build/libs/sophisticatedbackpacks-${FULL}-sources.jar"
          gh release edit "$TAG" --draft=false
